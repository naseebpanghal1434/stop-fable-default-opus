<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screenshot 1</title>
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <div class="browser">
      <div class="chrome">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="omnibox">claude.ai/new</div>
      </div>
      <div class="app">
        <aside>
          <div class="brand">Claude</div>
          <div class="nav-item on">New chat</div>
          <div class="nav-item dim">Chats</div>
          <div class="ghost"></div>
          <div class="ghost short"></div>
          <div class="ghost"></div>
        </aside>
        <main>
          <h1>How can I help you today?</h1>
          <div class="composer">
            <div class="input">Ask anything</div>
            <div class="row">
              <button class="chip fable" type="button">Fable 5.1</button>
              <button class="send" type="button" aria-label="Send"></button>
            </div>
          </div>
          <p class="note">Leave Fable selected, and later chats stay on Fable.</p>
        </main>
      </div>
    </div>
  </body>
</html>
