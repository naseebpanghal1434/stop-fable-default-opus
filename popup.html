<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px 16px 16px;
        font: 13px/1.45 system-ui, sans-serif;
        color: #1a1a1a;
        background: #f7f4ef;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f4ede4;
          background: #1a1a1a;
        }
        .muted {
          color: #b9b1a6;
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 650;
      }
      p {
        margin: 0 0 8px;
      }
      .muted {
        margin: 0;
        color: #5c564e;
      }
    </style>
  </head>
  <body>
    <h1>Stop Fable — Default Opus</h1>
    <p>
      Claude reuses the last model. Leave Fable selected and later chats stay
      on Fable — most chats do not need that.
    </p>
    <p class="muted">
      New chats that open on Fable are switched to Opus once. Pick Fable when
      you want it. Nothing is stored or sent; only the model chip is read on
      this page.
    </p>
  </body>
</html>
